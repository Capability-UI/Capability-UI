<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keel</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark">Keel</span>
        <span class="yard">Harbor yard 3</span>
      </div>
      <nav>
        <span class="nav-label">Generated floor</span>
        <a href="explorer.html">Data explorer</a>
      </nav>
      <label class="who">
        Shift
        <select id="principal"></select>
      </label>
    </header>
    <div class="layout">
      <main>
        <section class="canvas-head">
          <div>
            <h1>Floor</h1>
            <p class="quiet" id="canvas-lede">Ask the copilot to add tables, forms, cards, and views. Nothing is hardcoded here.</p>
          </div>
          <button type="button" class="ghost" id="clear-floor" hidden>Clear floor</button>
        </section>
        <section id="suggestions" class="chips"></section>
        <section id="floor" class="floor"></section>
      </main>
      <aside class="copilot">
        <header>
          <div>
            <h2>Copilot</h2>
            <p>Generates warehouse UI from this shift's permissions. Data changes still go through CUP.</p>
          </div>
          <button type="button" class="ghost on-dark" id="clear-chat">Clear chat</button>
        </header>
        <details class="model" id="model-form">
          <summary>Model connection</summary>
          <input id="openai-base" placeholder="API base URL" />
          <input id="openai-key" type="password" placeholder="API key" />
          <input id="openai-model" placeholder="Model" />
        </details>
        <p class="prompt-label">Try asking</p>
        <div id="chat-prompts" class="prompts"></div>
        <div class="log" id="chat-log"></div>
        <form class="ask" id="chat-form">
          <textarea id="chat-input" rows="3" placeholder="Ask for a briefing, a count sheet, a worklist, or any layout from this shift"></textarea>
          <button type="submit">Ask</button>
        </form>
      </aside>
    </div>
    <dialog id="dialog"></dialog>
    <script src="app.js" type="module"></script>
  </body>
</html>
